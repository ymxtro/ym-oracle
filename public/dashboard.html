<script>
// Applied before first paint so the saved theme never flashes. Preferences live in this browser only.
(function () {
  try {
    var v = JSON.parse(localStorage.getItem('ym_dash_prefs') || '{}');
    if (v && v.theme) document.documentElement.setAttribute('data-theme', v.theme);
    if (v && v.layout) document.documentElement.setAttribute('data-layout', v.layout);
  } catch (e) {}
})();

<div id="overlays"></div>

<script>
// ---------------------------------------------------------------------------------------------------------------------
// Auth: same behaviour as before. One prompt per bad password, never a cascade (see HANDOFF.md).
// ---------------------------------------------------------------------------------------------------------------------
function getPassword(){ try { return localStorage.getItem('ym_dash_pw') || ''; } catch(e){ return ''; } }
function setPassword(v){ try { localStorage.setItem('ym_dash_pw', v); } catch(e){} }
let authDeclinedUntil = 0;
async function api(path, opts){
  opts = opts || {};
  const sentPw = getPassword();
  const headers = Object.assign({}, opts.headers || {}, {'Content-Type':'application/json','X-Dashboard-Password':sentPw});
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if(res.status === 401){
    if(getPassword() !== sentPw) return api(path, opts);
    if(Date.now() < authDeclinedUntil) throw new Error('Unauthorized');
    const pw = prompt('Enter dashboard password:');
    if(pw !== null){ setPassword(pw); return api(path, opts); }
    authDeclinedUntil = Date.now() + 5000;
    throw new Error('Unauthorized');
  }
  return res.json();
}

// ---------------------------------------------------------------------------------------------------------------------
// Preferences (this browser only)
// ---------------------------------------------------------------------------------------------------------------------
const THEMES = [
  {k:'midnight', name:'Midnight', note:'The default', bg:'#0a0c10', panel:'#161a22', accent:'#8b5cf6', long:'#22c55e', short:'#ef4444', mist:'#8891a3', paper:'#eef1f6', line:'#242938'},
  {k:'graphite', name:'Graphite', note:'Neutral and quiet', bg:'#0f1012', panel:'#1a1b1e', accent:'#e4e6eb', long:'#4ade80', short:'#f87171', mist:'#9a9da6', paper:'#f1f2f4', line:'#2a2c31'},
  {k:'daylight', name:'Daylight', note:'Light, for bright rooms', bg:'#f4f5f8', panel:'#ffffff', accent:'#6d28d9', long:'#15803d', short:'#dc2626', mist:'#6a7285', paper:'#12151c', line:'#e2e5ec'},
  {k:'aurora', name:'Aurora', note:'Deep blue, cyan edge', bg:'#070b14', panel:'#0e1626', accent:'#22d3ee', long:'#34d399', short:'#fb7185', mist:'#7f8fae', paper:'#e8f0ff', line:'#1b2740'},
  {k:'ember', name:'Ember', note:'Warm dark, easy at night', bg:'#0f0b09', panel:'#1b1411', accent:'#fb923c', long:'#4ade80', short:'#f87171', mist:'#a29084', paper:'#f6ede6', line:'#2e231d'},
  {k:'paper', name:'Paper', note:'Warm light, low glare', bg:'#f6f1e8', panel:'#fffdf8', accent:'#b45309', long:'#2f7d4f', short:'#c2410c', mist:'#7d725f', paper:'#2a241a', line:'#e6dece'}
];
const prefs = {theme:'midnight', layout:'cockpit', hide:false};
(function loadPrefs(){
  try {
    const v = JSON.parse(localStorage.getItem('ym_dash_prefs') || '{}');
    if (v && THEMES.some(t => t.k === v.theme)) prefs.theme = v.theme;
    if (v && (v.layout === 'glance' || v.layout === 'cockpit')) prefs.layout = v.layout;
    prefs.hide = !!(v && v.hide);
  } catch(e){}
})();
function savePrefs(){
  try { localStorage.setItem('ym_dash_prefs', JSON.stringify(prefs)); } catch(e){}
  document.documentElement.setAttribute('data-theme', prefs.theme);
  document.documentElement.setAttribute('data-layout', prefs.layout);
}
document.documentElement.setAttribute('data-theme', prefs.theme);
document.documentElement.setAttribute('data-layout', prefs.layout);

// ---------------------------------------------------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------------------------------------------------
const ACTIVE_BOT_NAMES = ['YM ORACLE I', 'YM ORACLE II', 'YM ORACLE III', 'YM ORACLE IV']; // all four bots (IV = the swing bot). Keep identical to SERVER_TRACKED_BOT_NAMES in server.js and the manager's PING_BOT_NAMES
const PING_UI_WAIT_MS = 30000;   // manager poll 10s + reply window 15s + slack; keep >= those
const LATE_AFTER_SECS = 270;     // fallback only; the real value comes from /api/fleet-status
const S = {
  loaded:false, mode:'paper', halted:false, balance:null, available:null,
  positions:[], closed:[], bots:null, lateAfter:LATE_AFTER_SECS, exec:null, sync:null,
  pingState:null, pingResults:null, pingStartedAt:0,
  confirmHalt:false, confirmClear:false, testState:'idle', execOpen:false,
  acct:null, acctOpen:false, acctEnv:'live', acctKey:'', acctSecret:'', acctMsg:null, acctBusy:false, acctConfirm:false, acctResetArm:false,
  open:{}, settingsOpen:false, liveModal:false, liveText:'', liveErr:false, updatedAt:0
};
let timers = {};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, d) => Number(n).toLocaleString('en-US', {minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d});
const signed = n => (n >= 0 ? '+$' : '−$') + money(Math.abs(n));
const mk = x => (prefs.hide ? '••••' : x);
const cls = n => (n >= 0 ? 'long' : 'short');
const shortBot = n => String(n).replace('YM ORACLE ', 'Oracle ');
const updTxt = () => (S.updatedAt ? ago((Date.now() - S.updatedAt) / 1000) + ' ago' : '…');
const ago = secs => secs < 60 ? Math.round(secs) + 's' : (secs < 3600 ? Math.round(secs / 60) + 'm' : Math.round(secs / 3600) + 'h');

// ---------------------------------------------------------------------------------------------------------------------
// Derived
// ---------------------------------------------------------------------------------------------------------------------
function derive(){
  const closed = S.closed;
  const total = closed.reduce((a, t) => a + (parseFloat(t.realizedPnl) || 0), 0);
  const wins = closed.filter(t => parseFloat(t.realizedPnl) > 0).length;
  const avgRoi = closed.length ? closed.reduce((a, t) => a + (parseFloat(t.roiPct) || 0), 0) / closed.length : 0;
  const sorted = closed.slice().sort((a, b) => new Date(b.closedAt || 0) - new Date(a.closedAt || 0));
  const dayAgo = Date.now() - 86400000;
  const today = closed.filter(t => t.closedAt && new Date(t.closedAt).getTime() >= dayAgo).reduce((a, t) => a + (parseFloat(t.realizedPnl) || 0), 0);
  const upl = S.positions.reduce((a, p) => a + (parseFloat(p.unrealisedPnl) || 0), 0);
  // bots
  const now = Date.now();
  let bots = [];
  if (S.bots) {
    bots = ACTIVE_BOT_NAMES.map(name => {
      const b = S.bots.find(x => x.name === name);
      if (!b) return {name, state:'offline', sub:'No heartbeat yet'};
      const secs = Math.round((now - b.lastSeenAt) / 1000);
      const state = !b.online ? 'offline' : (secs > S.lateAfter ? 'late' : 'online');
      return {name, state, sub: state === 'late' ? 'Late · ' + ago(secs) + ' ago' : (state === 'offline' ? 'Offline · ' + ago(secs) : ago(secs) + ' ago')};
    });
  }
  if (S.pingState) {
    bots = ACTIVE_BOT_NAMES.map(name => {
      const r = S.pingResults && S.pingResults[name];
      if (S.pingState === 'wait') {
        if (!r) return {name, state:'late', sub:'Waiting… ' + Math.floor((now - S.pingStartedAt) / 1000) + 's'};
        return r.timeout ? {name, state:'offline', sub:'Timeout'} : {name, state:'online', sub:r.ms + ' ms'};
      }
      if (!r) return {name, state:'offline', sub:'No response'};
      return r.timeout ? {name, state:'offline', sub:'Timeout'} : {name, state:'online', sub:r.ms + ' ms'};
    });
  }
  const nOff = bots.filter(b => b.state === 'offline').length, nLate = bots.filter(b => b.state === 'late').length;
  const nOn = bots.length - nOff;
  // alerts from the Bybit execution reports (same rule as before: red/amber since last dismissed)
  let reports = [], alerts = [];
  if (S.exec && S.exec.reports) {
    reports = S.exec.reports.slice().sort((a, b) => b.at - a.at);
    let since = 0; try { since = parseInt(localStorage.getItem('ymExecDismissedAt') || '0', 10) || 0; } catch(e){}
    alerts = reports.filter(x => (x.sev === 'fail' || x.sev === 'warn') && x.at > since);
  }
  // sync sentence
  let sync = {color:'var(--mist)', text:'Checking sync…'};
  const y = S.sync;
  if (S.mode === 'paper') sync = {color:'var(--mist)', text:'Paper mode: nothing is sent to Bybit'};
  else if (y) {
    if (y.lastError && (!y.lastOkAt || now - y.lastOkAt > 180000)) sync = {color:'var(--pending)', text:'Cannot check Bybit right now'};
    else if (y.lastRecovered && now - y.lastRecovered.at < 3600000) sync = {color:'var(--pending)', text:'Bybit showed an open trade the log was missing (' + String(y.lastRecovered.symbol || '').replace(/USDT$/, '') + '). It was added automatically'};
    else if (y.staleOpen > 0) sync = {color:'var(--pending)', text:y.staleOpen + ' logged open trade' + (y.staleOpen > 1 ? 's are' : ' is') + ' not open on Bybit'};
    else if (y.masterOpen != null) sync = {color:'var(--long)', text:'In step with Bybit · ' + y.masterOpen + ' open, all logged'};
  }
  const problems = alerts.length + nOff + nLate + (sync.color === 'var(--pending)' ? 1 : 0);
  let status;
  if (S.mode === 'paper') status = {color:'var(--mist)', text:'Paper mode. Nothing is sent to Bybit.'};
  else if (S.halted) status = {color:'var(--pending)', text:'Trading is halted. New signals are ignored.'};
  else if (problems) {
    const bits = [];
    if (alerts.length) bits.push(alerts.length + (alerts.length > 1 ? ' order alerts' : ' order alert'));
    if (nOff) bits.push(nOff + (nOff > 1 ? ' bots offline' : ' bot offline'));
    if (nLate) bits.push(nLate + ' late');
    if (!bits.length) bits.push(sync.text.toLowerCase());
    status = {color:'var(--pending)', text:'Needs a look: ' + bits.join(', ') + '.'};
  } else status = {color:'var(--long)', text:'All good. Every bot is online and the log is in step with Bybit.'};
  return {closed, sorted, total, wins, avgRoi, today, upl, bots, nOff, nLate, nOn, reports, alerts, sync, status};
}

// ---------------------------------------------------------------------------------------------------------------------
// Pieces
// ---------------------------------------------------------------------------------------------------------------------
function chartSvg(D, h, gid){
  if (D.closed.length < 2) return {svg:'', dot:''};
  const chron = D.closed.slice().sort((a, b) => new Date(a.closedAt || 0) - new Date(b.closedAt || 0));
  let run = 0; const ser = chron.map(t => (run += parseFloat(t.realizedPnl) || 0));
  const mn = Math.min(0, Math.min.apply(null, ser)), mx = Math.max(0, Math.max.apply(null, ser)), rg = (mx - mn) || 1;
  const pts = ser.map((v, i) => [(i / (ser.length - 1)) * 600, (h - 8) - ((v - mn) / rg) * (h - 16)]);
  const str = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const col = D.total >= 0 ? 'var(--long)' : 'var(--short)';
  const svg = '<svg viewBox="0 0 600 ' + h + '" preserveAspectRatio="none" role="img" aria-label="Profit and loss since the log was last cleared">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity=".28"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="M0,' + h + ' L' + str.split(' ').join(' L') + ' L600,' + h + ' Z" fill="url(#' + gid + ')"/>' +
    '<polyline points="' + str + '" fill="none" stroke="' + col + '" stroke-width="2" style="vector-effect:non-scaling-stroke"/></svg>';
  const dot = '<span class="dot" style="left:100%;top:' + (pts[pts.length - 1][1] / h * 100).toFixed(1) + '%;background:' + col + '"></span>';
  return {svg, dot};
}
function posView(p){
  const upl = parseFloat(p.unrealisedPnl) || 0;
  const margin = (parseFloat(p.positionValue) || 0) / (parseFloat(p.leverage) || 1);
  const pct = margin > 0 ? (upl >= 0 ? '+' : '−') + Math.abs(upl / margin * 100).toFixed(1) + '%' : '';
  const isLong = p.side === 'Buy';
  return {sym:String(p.symbol || '').replace(/USDT$/, ''), isLong, dir:isLong ? 'LONG' : 'SHORT', upl, pct, size:p.size, lev:p.leverage, entry:p.entryPrice, mark:p.markPrice};
}
function tradeView(t){
  const pnl = parseFloat(t.realizedPnl) || 0, roi = parseFloat(t.roiPct) || 0;
  const secs = t.closedAt ? Math.max(0, (Date.now() - new Date(t.closedAt).getTime()) / 1000) : null;
  return {sym:String(t.symbol || '').replace(/USDT$/, ''), isLong:t.side === 'Buy', pnl, roi, ago: secs == null ? '' : ago(secs)};
}
function posListCockpit(D){
  if (!S.positions.length) return '<div class="empty">' + (S.mode === 'paper' ? 'Paper mode: nothing is open on Bybit.' : 'No open positions.') + '</div>';
  return S.positions.map(posView).map(p =>
    '<div class="item"><div class="row" style="gap:12px;min-width:150px;flex-wrap:nowrap"><div class="av ' + (p.isLong ? 'long' : 'short') + '" style="width:34px;height:34px;font-size:12px">' + (p.isLong ? 'L' : 'S') + '</div>' +
    '<div><div style="font-weight:500">' + esc(p.sym) + ' <span class="' + (p.isLong ? 'long' : 'short') + '" style="font-size:12px">' + p.dir + '</span></div><div class="mist" style="font-size:11px;margin-top:2px">' + esc(p.size) + ' · ' + esc(p.lev) + 'x</div></div></div>' +
    '<div class="mist" style="font-size:12px;flex:1 1 150px;min-width:0">' + esc(p.entry) + ' → <span style="color:var(--paper)">' + esc(p.mark) + '</span></div>' +
    '<div style="text-align:right;min-width:90px"><div class="' + cls(p.upl) + '" style="font-weight:500">' + mk(signed(p.upl)) + '</div><div class="' + cls(p.upl) + '" style="font-size:11px;margin-top:2px">' + p.pct + '</div></div></div>').join('');
}
function tradeListCockpit(D){
  if (!D.sorted.length) return '<div class="empty">No trades yet. Closed trades will appear here.</div>';
  return D.sorted.slice(0, 6).map(tradeView).map(t =>
    '<div class="trow"><div class="row" style="gap:12px;flex-wrap:nowrap"><div class="av ' + (t.isLong ? 'long' : 'short') + '" style="width:30px;height:30px;font-size:11px">' + (t.isLong ? 'L' : 'S') + '</div>' +
    '<div><div style="font-weight:500;font-size:13px">' + esc(t.sym) + '</div><div class="mist" style="font-size:11px;margin-top:1px">' + (t.ago ? 'Closed ' + t.ago + ' ago' : 'Closed') + '</div></div></div>' +
    '<div style="text-align:right"><div class="' + cls(t.pnl) + '" style="font-weight:500;font-size:13px">' + mk(signed(t.pnl)) + '</div><div class="mist" style="font-size:11px;margin-top:1px">' + (t.roi >= 0 ? '+' : '−') + Math.abs(t.roi).toFixed(1) + '% ROI</div></div></div>').join('');
}
function botListHtml(D, pad){
  if (!D.bots.length) return '<div class="empty" style="padding:14px 0 4px">No heartbeats received yet</div>';
  return D.bots.map(b => {
    const c = b.state === 'offline' ? 'var(--short)' : b.state === 'late' ? 'var(--pending)' : 'var(--long)';
    const tc = b.state === 'offline' ? 'var(--shortText)' : b.state === 'late' ? 'var(--pending)' : (S.pingState === 'done' || S.pingState === 'wait' ? 'var(--long)' : 'var(--mist)');
    return '<div class="brow"><div class="row" style="gap:10px;flex-wrap:nowrap;min-width:0"><span class="dotc" style="background:' + c + '"></span><span style="font-size:13px;font-weight:500">' + esc(shortBot(b.name)) + '</span></div><span style="font-size:12px;color:' + tc + ';white-space:nowrap">' + esc(b.sub) + '</span></div>';
  }).join('');
}
function execLine(x){
  const nm = String(x.symbol || '?').replace(/USDT$/, '');
  const dir = x.side === 'BUY' ? ' long' : (x.side === 'SELL' ? ' short' : '');
  const kind = x.kind === 'SLTP' ? 'stop update' : (x.kind === 'CLOSE' ? 'close' : 'order');
  return nm + dir + ' ' + kind;
}
function alertColor(sev){ return sev === 'fail' ? 'var(--shortText)' : (sev === 'warn' ? 'var(--pending)' : 'var(--mist)'); }
function alertsInner(D, withDetail){
  const rows = (S.execOpen ? D.reports.slice(0, 6) : D.alerts);
  if (!rows.length) return '<div class="row" style="gap:10px;padding:14px 0 6px;color:var(--long);font-size:13px"><span class="dotc" style="background:var(--long)"></span>All clear. Every order went through.</div>';
  return rows.map(x => {
    const t = String(x.text || ''), more = (x.sev !== 'quiet' && x.detail) ? '. ' + String(x.detail).charAt(0).toUpperCase() + String(x.detail).slice(1) : '';
    return '<div class="alert" style="border-color:' + (D.alerts.some(a => a.sev === 'fail') ? 'var(--failBorder)' : D.alerts.length ? 'var(--warnBorder)' : 'var(--line2)') + '">' +
      '<div class="chead" style="font-size:13px;align-items:flex-start"><span><span style="color:' + alertColor(x.sev) + '">●</span> ' + esc(execLine(x)) + (x.sev === 'fail' ? ' failed' : '') + '</span><span class="mist" style="font-size:12px;white-space:nowrap">' + ago(Math.max(0, (Date.now() - x.at) / 1000)) + ' ago</span></div>' +
      '<div style="font-size:12px;color:' + alertColor(x.sev) + ';margin:4px 0 0 16px;line-height:1.5">' + esc(t + more) + '</div></div>';
  }).join('');
}
function testLabel(){ return {idle:['Send test alert','var(--mist)'], busy:['Sending…','var(--mist)'], sent:['Sent. Check Telegram','var(--long)'], none:['Not configured','var(--shortText)'], fail:['Failed','var(--shortText)']}[S.testState]; }

          '<label class="mist" style="display:block;font-size:11px;margin-bottom:5px" for="acctKey">New API key</label><input id="acctKey" class="fld" autocomplete="off" spellcheck="false" value="' + esc(S.acctKey) + '">' +
          '<label class="mist" style="display:block;font-size:11px;margin-bottom:5px" for="acctSecret">New API secret</label><input id="acctSecret" class="fld" type="password" autocomplete="new-password" value="' + esc(S.acctSecret) + '">';
        if (S.acctConfirm) h += '<div style="background:var(--warnBg);border:1px solid var(--warnBorder);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:10px">' + esc(S.acctConfirm) + '</div>';
        h += '<button class="mbtn" data-act="acctSave"' + (S.acctBusy ? ' disabled' : '') + ' style="width:100%;background:var(--accent);color:' + (prefs.theme === 'graphite' ? '#111' : '#fff') + ';font-weight:600">' + (S.acctBusy ? 'Checking with Bybit…' : (S.acctConfirm ? 'Switch anyway' : 'Check and save')) + '</button>' +
          '<div class="mist" style="font-size:11px;margin-top:8px;line-height:1.5">The key is checked with Bybit first, then stored encrypted. It takes effect straight away, no restart. ' + (S.acctEnv === 'demo' ? 'Make a demo key while Bybit is in Demo Trading mode.' : 'Use a trade-only key with no withdrawal permission.') + '</div>';
        if (a.source === 'saved') h += '<button data-act="acctReset" class="link" style="padding-left:0;margin-top:6px;color:' + (S.acctResetArm ? 'var(--shortText)' : 'var(--mist)') + '">' + (S.acctResetArm ? 'Tap again to go back to the Render settings' : 'Use the Render settings instead') + '</button>';
      }
    }
    if (S.acctMsg) h += '<div style="font-size:12px;margin-top:10px;line-height:1.5;color:' + (S.acctMsg.ok ? 'var(--long)' : 'var(--shortText)') + '">' + esc(S.acctMsg.text) + '</div>';
  }
  return h + '</div>';
}

    h += '<div class="scrim" data-act="closeSettings"></div><div class="drawer" role="dialog" aria-label="Appearance">' +

      acctHtml() + '<div class="lbl" style="margin-bottom:10px">Layout</div><div class="opt">' +
      '<button class="optb' + (prefs.layout === 'cockpit' ? ' on' : '') + '" data-act="layout" data-v="cockpit" aria-pressed="' + (prefs.layout === 'cockpit') + '"><div style="display:flex;gap:5px;height:46px;margin-bottom:10px"><div style="flex:2;display:flex;flex-direction:column;gap:4px"><div style="flex:2;background:var(--line);border-radius:4px"></div><div style="flex:1;background:var(--line);border-radius:4px"></div></div><div style="flex:1;display:flex;flex-direction:column;gap:4px"><div style="flex:1;background:var(--line);border-radius:4px"></div><div style="flex:1;background:var(--line);border-radius:4px"></div></div></div><div style="font-size:13px;font-weight:500">Cockpit</div><div class="mist" style="font-size:11px;margin-top:2px">Everything at once</div></button>' +
      '<button class="optb' + (prefs.layout === 'glance' ? ' on' : '') + '" data-act="layout" data-v="glance" aria-pressed="' + (prefs.layout === 'glance') + '"><div style="display:flex;flex-direction:column;align-items:center;gap:4px;height:46px;margin-bottom:10px"><div style="width:46%;height:12px;background:var(--line);border-radius:4px"></div><div style="width:70%;height:4px;background:var(--line);border-radius:2px"></div><div style="width:90%;height:4px;background:var(--line);border-radius:2px;margin-top:4px"></div><div style="width:90%;height:4px;background:var(--line);border-radius:2px"></div><div style="width:90%;height:4px;background:var(--line);border-radius:2px"></div></div><div style="font-size:13px;font-weight:500">Glance</div><div class="mist" style="font-size:11px;margin-top:2px">One calm column</div></button></div>' +
      '<div class="lbl" style="margin-bottom:10px">Theme</div><div class="opt">' +
      THEMES.map(t => '<button class="optb' + (prefs.theme === t.k ? ' on' : '') + '" data-act="theme" data-v="' + t.k + '" aria-pressed="' + (prefs.theme === t.k) + '" style="background:' + t.bg + ';color:' + t.paper + ';' + (prefs.theme === t.k ? '' : 'border-color:' + t.line) + '"><div style="background:' + t.panel + ';border-radius:8px;padding:8px;margin-bottom:9px"><div style="display:flex;align-items:center;gap:5px;margin-bottom:7px"><span style="width:7px;height:7px;border-radius:50%;background:' + t.accent + '"></span><span style="height:4px;width:34px;border-radius:2px;background:' + t.mist + ';opacity:.5"></span></div><div style="display:flex;gap:4px;align-items:flex-end;height:20px"><span style="flex:1;height:60%;background:' + t.long + ';border-radius:2px"></span><span style="flex:1;height:35%;background:' + t.short + ';border-radius:2px"></span><span style="flex:1;height:90%;background:' + t.long + ';border-radius:2px"></span><span style="flex:1;height:50%;background:' + t.long + ';border-radius:2px"></span></div></div><div style="font-size:13px;font-weight:500">' + t.name + '</div><div style="font-size:11px;color:' + t.mist + ';margin-top:2px">' + t.note + '</div></button>').join('') + '</div>' +
      '<div class="lbl" style="margin-bottom:6px">Privacy</div>' +
      '<button data-act="hide" aria-pressed="' + prefs.hide + '" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;min-height:56px;text-align:left"><span><span style="display:block;font-size:13px;font-weight:500">Hide amounts</span><span class="mist" style="display:block;font-size:11px;margin-top:2px">Balance and profit show as dots</span></span><span class="sw" style="background:' + (prefs.hide ? 'var(--long)' : 'var(--line)') + '"><b style="left:' + (prefs.hide ? '20px' : '2px') + '"></b></span></button>' +
      '<div class="mist" style="font-size:11px;margin-top:18px;line-height:1.55">Look and privacy choices are saved on this device only.</div>' +
      '<div class="lbl" style="margin:26px 0 4px">Go to</div><a class="navlink" href="/"><span>Home<br><small>All your pages in one place</small></span><span class="mist">\u203a</span></a><a class="navlink" href="/admin"><span>Admin console<br><small>Users, plan, orders, security</small></span><span class="mist">\u203a</span></a><a class="navlink" href="/join"><span>User sign-up page<br><small>Where invited users register</small></span><span class="mist">\u203a</span></a></div>';
  }
  if (S.liveModal) {
    const ok = S.liveText === 'LIVE';
    h += '<div class="modal"><div class="mbox" role="dialog" aria-label="Switch to live trading"><div style="font-size:16px;font-weight:600;margin-bottom:8px">Switch to live trading?</div>' +
      '<p class="mist" style="font-size:13px;line-height:1.55;margin:0 0 16px">From now on every signal places a real order on Bybit, and is copied to every user account. Type LIVE to confirm.</p>' +
      '<label class="mist" style="display:block;font-size:11px;margin-bottom:6px" for="liveIn">Confirmation</label><input id="liveIn" value="' + esc(S.liveText) + '" autocomplete="off" placeholder="LIVE">' +
      (S.liveErr ? '<p style="color:var(--shortText);font-size:11px;margin:-8px 0 12px">Type LIVE exactly to confirm.</p>' : '') +
      '<div class="row" style="flex-wrap:nowrap"><button class="mbtn" data-act="liveCancel" style="background:var(--chip);color:var(--mist)">Cancel</button><button class="mbtn" data-act="liveGo" style="background:' + (ok ? 'var(--short)' : 'var(--chip)') + ';color:' + (ok ? '#fff' : 'var(--mist)') + ';font-weight:600">Go live</button></div></div></div>';
  }
  return h;
}

// ---------------------------------------------------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------------------------------------------------
let lastHtml = '', lastOv = '';
function render(){
  const D = derive();
  const app = document.getElementById('app');
  const banner = S.mode === 'paper' ? '<div class="banner"><i></i>Paper mode: no real orders are sent to Bybit</div>' : '';
  document.body.className = prefs.layout === 'glance' ? 'glance' : '';
  const html = banner + '<div class="wrap">' + (prefs.layout === 'glance' ? glance(D) : cockpit(D)) + '</div>';
  if (html !== lastHtml) { app.innerHTML = html; lastHtml = html; }
  const ov = document.getElementById('overlays');
  const hadInput = document.activeElement && document.activeElement.id === 'liveIn';
  const sel = hadInput ? document.activeElement.selectionStart : 0;
  const ovHtml = overlaysHtml();
  if (ovHtml !== lastOv) {
    const drawer = ov.querySelector('.drawer'), keep = drawer ? drawer.scrollTop : 0;
    ov.innerHTML = ovHtml; lastOv = ovHtml;
    const nd = ov.querySelector('.drawer'); if (nd) nd.scrollTop = keep;
  }
  if (S.liveModal) { const i = document.getElementById('liveIn'); if (i) { if (hadInput) { i.focus(); try { i.setSelectionRange(sel, sel); } catch(e){} } i.oninput = e => { S.liveText = e.target.value; S.liveErr = false; const b = ov.querySelector('[data-act="liveGo"]'); const ok = S.liveText === 'LIVE'; if (b) { b.style.background = ok ? 'var(--short)' : 'var(--chip)'; b.style.color = ok ? '#fff' : 'var(--mist)'; } }; i.onkeydown = e => { if (e.key === 'Enter') act('liveGo'); }; } }
}

// ---------------------------------------------------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------------------------------------------------
async function act(a, el){
  if (a === 'settings') { S.settingsOpen = true; render(); loadAcct(); }
  else if (a === 'acctOpen') { S.acctOpen = !S.acctOpen; S.acctMsg = null; render(); }
  else if (a === 'acctEnv') { S.acctEnv = el.dataset.v; render(); }
  else if (a === 'acctSave') saveAcct();
  else if (a === 'acctReset') resetAcct();
  else if (a === 'closeSettings') { S.settingsOpen = false; render(); }
  else if (a === 'layout') { prefs.layout = el.dataset.v; savePrefs(); render(); }
  else if (a === 'theme') { prefs.theme = el.dataset.v; savePrefs(); render(); }
  else if (a === 'hide') { prefs.hide = !prefs.hide; savePrefs(); render(); }
  else if (a === 'acc') { const k = el.dataset.key; S.open[k] = el.dataset.open !== '1'; render(); }
  else if (a === 'mode') {
    if (S.mode === 'live') { try { await api('/api/mode', {method:'POST', body:JSON.stringify({mode:'paper'})}); } catch(e){} refreshStatus(); }
    else { S.liveModal = true; S.liveText = ''; S.liveErr = false; render(); const i = document.getElementById('liveIn'); if (i) i.focus(); }
  }
  else if (a === 'liveCancel') { S.liveModal = false; render(); }
  else if (a === 'liveGo') {
    if (S.liveText !== 'LIVE') { S.liveErr = true; render(); return; }
    try { await api('/api/mode', {method:'POST', body:JSON.stringify({mode:'live', confirm:'LIVE'})}); } catch(e){}
    S.liveModal = false; refreshStatus();
  }
  else if (a === 'halt') {
    if (S.halted) { try { await api('/api/resume', {method:'POST'}); } catch(e){} S.confirmHalt = false; refreshStatus(); return; }
    if (S.confirmHalt) { clearTimeout(timers.halt); S.confirmHalt = false; try { await api('/api/halt', {method:'POST', body:JSON.stringify({reason:'dashboard'})}); } catch(e){} refreshStatus(); return; }
    S.confirmHalt = true; render(); clearTimeout(timers.halt); timers.halt = setTimeout(() => { S.confirmHalt = false; render(); }, 3000);
  }
  else if (a === 'clear') {
    if (S.confirmClear) { clearTimeout(timers.clear); S.confirmClear = false; try { await api('/api/clear-trade-log', {method:'POST'}); } catch(e){} refreshActivity(); return; }
    S.confirmClear = true; render(); clearTimeout(timers.clear); timers.clear = setTimeout(() => { S.confirmClear = false; render(); }, 3000);
  }
  else if (a === 'dismiss') {
    if (S.exec && S.exec.reports && S.exec.reports.length) { try { localStorage.setItem('ymExecDismissedAt', String(Math.max.apply(null, S.exec.reports.map(x => x.at)))); } catch(e){} }
    render();
  }
  else if (a === 'toggleExec') { S.execOpen = !S.execOpen; render(); }
  else if (a === 'test') {
    S.testState = 'busy'; render();
    try {
      const r = await api('/api/test-offline-alert?send=true');
      S.testState = (r.delivery && r.delivery.configured) ? 'sent' : 'none';
    } catch(e){ S.testState = 'fail'; }
    render(); clearTimeout(timers.test); timers.test = setTimeout(() => { S.testState = 'idle'; render(); }, 4000);
  }
  else if (a === 'ping') pingFleet();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.liveModal) { S.liveModal = false; render(); } else if (S.settingsOpen) { S.settingsOpen = false; render(); } } });

// ---------------------------------------------------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------------------------------------------------
async function refreshStatus(){
  try { const s = await api('/api/status'); S.mode = s.mode; S.halted = !!(s.breaker && s.breaker.tripped); S.loaded = true; } catch(e){}
  render();
}
async function refreshBalance(){
  try { const b = await api('/api/balance'); if (b.success) { S.balance = b.balance; S.available = b.available; } } catch(e){}
}
async function refreshActivity(){
  try {
    const [p, t] = await Promise.all([api('/api/positions'), api('/api/trade-log')]);
    S.positions = p.success ? p.positions : [];
    S.closed = (t.success ? t.trades : []).filter(x => x.status === 'CLOSED');
  } catch(e){}
  render();
}
async function refreshFleet(){
  if (S.pingState === 'wait') return;
  try { const f = await api('/api/fleet-status'); if (f.success) { S.bots = f.bots; if (typeof f.lateAfterSecs === 'number') S.lateAfter = f.lateAfterSecs; } } catch(e){}
}
async function refreshExec(){
  try { const r = await api('/api/exec-reports'); if (r.success) S.exec = r; } catch(e){}
}
async function refreshSync(){
  try { const r = await api('/api/sync-status'); if (r.success) S.sync = r; } catch(e){}
}
// ---- trading account key (the master Bybit account this page shows) ----
async function loadAcct(){
  try { const r = await api('/api/master-key'); if (r.success) { S.acct = r; if (r.env === 'demo' || r.env === 'live') S.acctEnv = S.acctOpen ? S.acctEnv : r.env; } } catch(e){}
  render();
}
async function saveAcct(){
  if (S.acctBusy) return;
  if (!S.acctKey.trim() || !S.acctSecret.trim()) { S.acctMsg = {ok:false, text:'Paste both the key and the secret.'}; render(); return; }
  S.acctBusy = true; S.acctMsg = null; render();
  let r;
  try { r = await api('/api/master-key', {method:'POST', body:JSON.stringify({apiKey:S.acctKey.trim(), apiSecret:S.acctSecret.trim(), env:S.acctEnv, confirmOpen:!!S.acctConfirm})}); }
  catch(e){ r = {success:false, message:'Could not reach the server.'}; }
  S.acctBusy = false;
  if (r.success) {
    S.acctKey = ''; S.acctSecret = ''; S.acctConfirm = false; S.acctOpen = false;
    S.acctMsg = {ok:true, text:'Saved. Now trading with ' + r.hint + ' (' + (r.env === 'demo' ? 'Demo' : 'Live') + ')' + (r.equity != null ? ', balance $' + money(r.equity) : '') + '.' + (r.warning ? ' ' + r.warning : '')};
    await loadAcct(); refreshAll();
  } else if (r.needConfirm) { S.acctConfirm = r.message; render(); }
  else { S.acctConfirm = false; S.acctMsg = {ok:false, text:r.message || 'Could not save the key.'}; render(); }
}
async function resetAcct(){
  if (!S.acctResetArm) { S.acctResetArm = true; render(); clearTimeout(timers.acctArm); timers.acctArm = setTimeout(() => { S.acctResetArm = false; render(); }, 3000); return; }
  S.acctResetArm = false;
  let r; try { r = await api('/api/master-key/reset', {method:'POST'}); } catch(e){ r = {success:false, message:'Could not reach the server.'}; }
  S.acctMsg = r.success ? {ok:true, text:'Back on the Render settings (' + r.hint + ').'} : {ok:false, text:r.message || 'Could not reset.'};
  await loadAcct(); refreshAll();
}
document.addEventListener('input', e => {
  if (e.target.id === 'acctKey') S.acctKey = e.target.value;
  else if (e.target.id === 'acctSecret') S.acctSecret = e.target.value;
  else if (e.target.id === 'acctKey' || e.target.id === 'acctSecret') return;
  if (S.acctConfirm && (e.target.id === 'acctKey' || e.target.id === 'acctSecret')) S.acctConfirm = false;
});
async function pingFleet(){
  if (S.pingState === 'wait') return;
  S.pingState = 'wait'; S.pingResults = {}; S.pingStartedAt = Date.now(); render();
  let pingId;
  try { const r = await api('/api/ping-fleet', {method:'POST'}); pingId = r.pingId; }
  catch(e){ S.pingState = null; render(); return; }
  clearInterval(timers.ping);
  timers.ping = setInterval(async () => {
    let st; try { st = await api('/api/ping-status/' + pingId); } catch(e){ return; }
    if (st.success) S.pingResults = st.results || {};
    const all = ACTIVE_BOT_NAMES.every(n => S.pingResults[n]);
    if (all || Date.now() - S.pingStartedAt > PING_UI_WAIT_MS) { clearInterval(timers.ping); S.pingState = 'done'; clearTimeout(timers.pingClear); timers.pingClear = setTimeout(() => { S.pingState = null; refreshFleet().then(render); }, 20000); }
    render();
  }, 1000);
}
async function refreshAll(){
  await Promise.all([refreshStatus(), refreshBalance(), refreshActivity(), refreshFleet(), refreshExec(), refreshSync()]);
  S.updatedAt = Date.now(); render();
}
refreshAll();
setInterval(refreshAll, 10000);
// keep "Updated Ns ago" moving without redrawing the page (a redraw mid-click would swallow the click)
setInterval(() => { const t = updTxt(); document.querySelectorAll('.upd').forEach(n => { n.textContent = t; }); }, 1000);
render();
</script>
