<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Trading monitor</title>
<style>
  :root{--bg:#0a0c10;--panel:#161a22;--line:#242938;--mist:#8891a3;--paper:#eef1f6;--long:#22c55e;--short:#ef4444;--signal:#8b5cf6;--inset:#0f1218;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--paper);font-family:Arial,sans-serif;margin:0 auto;max-width:440px;padding:20px 16px 50px;font-size:14px}
  h1{font-size:17px;margin:0 0 2px}.sub{color:var(--mist);font-size:12px;margin:0 0 14px}
  .card{background:var(--panel);border-radius:16px;padding:16px;margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--inset);border-radius:12px;padding:10px}.kpi p{margin:0}.kpi .l{font-size:10px;color:var(--mist);margin-bottom:4px}.kpi .v{font-size:16px;font-weight:500}
  .big{font-size:30px;font-weight:500;margin:4px 0 8px}
  .long{color:var(--long)}.short{color:var(--short)}.mist{color:var(--mist)}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .pill{font-size:11px;padding:3px 10px;border-radius:20px;background:#1a2e22;color:var(--long)}.pill.off{background:#2b2412;color:#f2b134}
  .spark{width:100%;height:auto;display:block}.spark .ln{fill:none;stroke:var(--long);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}.spark .area{fill:rgba(34,197,94,.14)}.spark .dot{fill:var(--long);stroke:var(--panel);stroke-width:2}.spark.dn .ln{stroke:var(--short)}.spark.dn .area{fill:rgba(239,68,68,.12)}.spark.dn .dot{fill:var(--short)}.spark .g{stroke:var(--line);stroke-dasharray:3 4;stroke-width:1;vector-effect:non-scaling-stroke}
  .foot{color:var(--mist);font-size:11px;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div id="out"><p class="sub">Loading...</p></div>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return (n >= 0 ? '+$' : '-$') + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ago(t){ if(!t) return 'not yet'; const s = Math.max(0, Math.round((Date.now() - new Date(t).getTime())/1000)); return s < 60 ? s+'s ago' : (s < 3600 ? Math.round(s/60)+'m ago' : (s < 86400 ? Math.round(s/3600)+'h ago' : Math.round(s/86400)+'d ago')); }
function chart(curve){
  if(curve.length < 2) return '';
  const w = 320, h = 70, p = 6, mn = Math.min(0, Math.min.apply(null, curve)), mx = Math.max(0, Math.max.apply(null, curve)), r = (mx - mn) || 1;
  const X = function(i){ return p + i * (w - p*2) / (curve.length - 1); }, Y = function(v){ return h - p - (v - mn) / r * (h - p*2); };
  const pts = curve.map(function(v, i){ return X(i).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ');
  const up = curve[curve.length-1] >= 0;
  return '<svg class="spark ' + (up ? '' : 'dn') + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Net result over time"><line class="g" x1="0" x2="' + w + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '"/><polygon class="area" points="' + p + ',' + h + ' ' + pts + ' ' + (w-p) + ',' + h + '"/><polyline class="ln" points="' + pts + '"/><circle class="dot" cx="' + X(curve.length-1).toFixed(1) + '" cy="' + Y(curve[curve.length-1]).toFixed(1) + '" r="4"/></svg>';
}
(async function(){
  const token = location.pathname.split('/').filter(Boolean).pop();
  const out = document.getElementById('out');
  let j;
  try { j = await (await fetch('/api/share/' + encodeURIComponent(token))).json(); } catch(e){ j = {success:false, message:'Could not load'}; }
  if(!j.success){ out.innerHTML = '<div class="card"><b>Link not available</b><p class="sub" style="margin:6px 0 0">' + esc(j.message || 'This link may have been switched off.') + '</p></div>'; return; }
  const win = j.trades ? Math.round(j.wins / j.trades * 100) + '%' : '-';
  out.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h1>' + esc(j.username) + '</h1><span class="pill ' + (j.status === 'Active' ? '' : 'off') + '">' + esc(j.status) + '</span></div>' +
    (j.env === 'demo' ? '<p class="sub" style="color:#f2b134">Demo account: practice money, not real funds.</p>' : '') +
    '<p class="sub">Automated trading results. Trading since ' + new Date(j.since).toLocaleDateString() + ' · updated ' + ago(j.lastSyncedAt) + '</p>' +
    '<div class="card"><span class="mist" style="font-size:11px">Net result (USD)</span><p class="big ' + (j.pnl >= 0 ? 'long' : 'short') + '">' + money(j.pnl) + '</p>' + chart(j.curve) + (j.funding ? '<p class="mist" style="font-size:11px;margin:6px 0 0">Includes ' + money(j.funding) + ' of funding fees</p>' : '') + '</div>' +
    '<div class="kpis" style="margin-bottom:14px"><div class="kpi"><p class="l">Win rate</p><p class="v">' + win + '</p></div><div class="kpi"><p class="l">Trades</p><p class="v">' + j.trades + '</p></div><div class="kpi"><p class="l">Balance</p><p class="v">' + (j.balance === null ? 'Hidden' : '$' + Number(j.balance).toLocaleString(undefined,{maximumFractionDigits:2})) + '</p></div></div>' +
    '<div class="card"><div class="mist" style="font-size:11px;margin-bottom:6px">Recent closed trades</div>' +
    (j.recent.length ? j.recent.map(function(t){ return '<div class="row"><span>' + esc(String(t.symbol || '').replace('USDT','')) + ' <span class="mist">' + esc(t.side) + ' · ' + ago(t.at) + '</span></span><span class="' + (t.pnl >= 0 ? 'long' : 'short') + '">' + money(t.pnl) + '</span></div>'; }).join('') : '<div class="mist" style="padding:10px 0;font-size:13px">No closed trades yet</div>') + '</div>' +
    '<p class="foot">Read-only view. Figures are synced from the trader\'s Bybit account every few minutes. Past results do not guarantee future results, and trading can lose money.</p>';
})();
</script>
</body>
</html>
