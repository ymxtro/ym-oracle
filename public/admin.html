<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>YM Oracle – Console</title>
<style>
  :root{--bg:#0a0c10;--panel:#161a22;--inset:#0f1218;--line:#242938;--mist:#8891a3;--paper:#eef1f6;--long:#22c55e;--short:#ef4444;--signal:#8b5cf6;--pending:#f2b134;color-scheme:dark}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--paper);font-family:Arial,Helvetica,sans-serif;margin:0;font-size:13px;line-height:1.45}
  h1{font-size:17px;margin:0;font-weight:700} h2{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 8px;font-weight:400}
  p{margin:0} button,input,select{font-family:inherit}
  .long{color:var(--long)}.short{color:var(--short)}.mist{color:var(--mist)}.warn{color:var(--pending)}.small{font-size:11px}.num{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .card{background:var(--panel);border-radius:14px;padding:16px;min-width:0}
  .card.flat{background:var(--inset)}
  .btn{background:transparent;border:1px solid var(--line);color:var(--mist);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer;line-height:1.2}
  a.btn{text-decoration:none;display:inline-block}
  .line>span.lft{text-align:left}
  .btn:hover{color:var(--paper);border-color:var(--mist)} .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.pri{background:var(--signal);border-color:var(--signal);color:#fff} .btn.pri:hover{filter:brightness(1.08)}
  .btn.danger{color:var(--short);border-color:#5a2a30}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;background:var(--bg)}
  .seg button{border:0;background:transparent;color:var(--mist);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--signal);color:#fff}
  .meter{display:inline-block;width:64px;height:6px;border-radius:999px;background:var(--inset);border:1px solid var(--line);overflow:hidden;vertical-align:middle}.meter i{display:block;height:100%;background:var(--long);transition:width .3s}.meter.watch i,.meter.alert i{background:var(--pending)}.meter.danger i{background:var(--short)}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--mist);white-space:nowrap;background:transparent;font-family:inherit}
  .chip.long{color:var(--long);border-color:#1d5a37}.chip.warn{color:var(--pending);border-color:#6b5320}.chip.short{color:var(--short);border-color:#6b2a2a}
  .chip.btnlike{cursor:pointer}.chip.btnlike[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#fff}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mist);flex:none;display:inline-block}
  .dot.ok{background:var(--long)}.dot.bad{background:var(--short)}.dot.mid{background:var(--pending)}
  .new{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--signal);border:1px solid #4b3a8a;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
  .sw{position:relative;width:38px;height:22px;flex:none}
  .sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:transform .15s}
  .sw input:checked+i{background:var(--signal)}.sw input:checked+i::after{transform:translateX(16px);background:#fff}
  .sw input:focus-visible+i{outline:2px solid var(--signal);outline-offset:2px}
  .line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}
  .line>span:last-child{text-align:right}
  input[type=text],input[type=password],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--paper);font-size:13px}
  label.l{display:block;font-size:11px;color:var(--mist);margin:12px 0 4px}
  .box{border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;background:rgba(242,177,52,.12);color:var(--pending);border:1px solid rgba(242,177,52,.35)}
  .box.red{background:rgba(239,68,68,.1);color:var(--short);border-color:rgba(239,68,68,.35)}
  .box.plain{background:var(--inset);color:var(--mist);border-color:var(--line)}
  code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:12px;user-select:all;word-break:break-all}


  /* live trades */
  .lt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .lt{background:var(--panel);border-radius:14px;padding:14px 14px 12px;min-width:0;display:grid;gap:10px;border:1px solid transparent}
  .lt.b-strong{border-color:rgba(34,197,94,.28)}.lt.b-fragile{border-color:rgba(242,177,52,.32)}.lt.b-risk{border-color:rgba(239,68,68,.4)}
  .lt-h{display:flex;align-items:center;gap:12px}.lt-h .t{min-width:0;flex:1}.lt-h .t b{font-size:15px}
  .ring{width:54px;height:54px;flex:none;position:relative}.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:var(--line);stroke-width:5}.ring .fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .4s}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
  .bnd-strong{color:var(--long)}.bnd-steady{color:#60a5fa}.bnd-fragile{color:var(--pending)}.bnd-risk{color:var(--short)}.bnd-unknown{color:var(--mist)}
  .fg-strong{stroke:var(--long)}.fg-steady{stroke:#60a5fa}.fg-fragile{stroke:var(--pending)}.fg-risk{stroke:var(--short)}.fg-unknown{stroke:var(--mist)}
  .lad{position:relative;height:30px;margin:2px 4px 0}
  .lad .trk{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:999px;background:var(--inset);overflow:hidden}
  .lad .zr{position:absolute;top:0;bottom:0;background:rgba(239,68,68,.35)}.lad .zg{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.3)}.lad .zl{position:absolute;top:0;bottom:0;background:rgba(242,177,52,.45)}
  .lad .mk{position:absolute;top:6px;width:2px;height:18px;margin-left:-1px;border-radius:2px;background:var(--mist)}
  .lad .mk.sl{background:var(--short)}.lad .mk.st{background:var(--pending)}.lad .mk.en{background:var(--paper)}.lad .mk.tp{background:var(--long)}.lad .mk.pk{background:var(--mist);opacity:.55;height:10px;top:10px}
  .lad .nw{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:3px solid var(--panel);background:var(--mist)}
  .lad .nw.up{background:var(--long)}.lad .nw.dn{background:var(--short)}
  .lt-v{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:11px}.lt-v div{background:var(--inset);border-radius:9px;padding:6px 8px;min-width:0}.lt-v span{display:block;color:var(--mist);font-size:10px}.lt-v b{font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
  .pt{display:grid;grid-template-columns:72px minmax(0,1fr) 28px;align-items:center;gap:8px;font-size:11px;color:var(--mist)}
  .pt i{display:block;height:6px;border-radius:999px;background:var(--inset);overflow:hidden}.pt i u{display:block;height:100%;border-radius:999px;text-decoration:none}
  .pt em{font-style:normal;text-align:right;color:var(--paper);font-variant-numeric:tabular-nums}
  .lt-f{display:flex;gap:6px;flex-wrap:wrap}.lt-tr{display:block;width:100%;height:34px}.lt-tr .ln{fill:none;stroke:var(--mist);stroke-width:1.6;vector-effect:non-scaling-stroke}.lt-tr .g{stroke:var(--line);stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
  .bandbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--inset);gap:2px}.bandbar i{display:block;height:100%}
  .sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .g2g{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;align-items:start}
  .pagehd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.pagehd p{color:var(--mist);font-size:12px;max-width:62ch}
  .sec2{margin:22px 0 10px;display:flex;align-items:center;gap:10px}.sec2 h3{margin:0;font-size:13px;font-weight:600}.sec2 .mist{font-size:11px}

  /* login */
  #login{max-width:340px;margin:60px auto}
  #login input{margin-top:10px}
  #err{color:var(--short);font-size:12px;margin-top:10px;min-height:16px}

  /* header */
  .ah{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:26px;height:26px;border-radius:8px;background:var(--signal);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:11px;letter-spacing:.5px;font-weight:700;background:transparent;color:var(--paper);cursor:pointer}
  .pill.live .dot{background:var(--long);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .pill.dry{color:var(--pending);border-color:var(--pending)}.pill.dry .dot{background:var(--pending)}
  .pill.paused{color:var(--short);border-color:var(--short)}.pill.paused .dot{background:var(--short)}
  .pop{position:absolute;right:0;top:calc(100% + 8px);width:min(330px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .pop h3{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 0;font-weight:400}
  /* console shell: side menu on desktop, bottom bar on phones */
  .shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
  #nav{position:sticky;top:0;height:100vh;align-self:start;padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  #nav .navhead{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
  #nav .navgap{flex:1}
  #nav .navlbl{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--mist);padding:12px 10px 4px}
  #nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--mist);padding:9px 10px;border-radius:10px;font-size:13px;cursor:pointer;text-align:left;position:relative}
  #nav button svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #nav button:hover{color:var(--paper);background:rgba(238,241,246,.04)}
  #nav button[aria-selected="true"]{background:var(--panel);color:var(--paper)}
  #nav button[aria-selected="true"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
  #nav .badge{margin-left:auto}
  .main{padding:18px 22px 80px;max-width:1160px;min-width:0}
  .mlogo{display:none}
  .g3.g3t{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row3{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row3:first-child{border-top:0}
  .row3 .r{text-align:right}
  .hint2{font-size:11px;color:var(--mist);margin-top:2px}
  @media (max-width:900px){
    .shell{grid-template-columns:minmax(0,1fr)}
    #nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--bg);z-index:30;gap:0}
    #nav .navhead,#nav .navgap,#nav .navlbl{display:none}
    #nav button{flex-direction:column;gap:3px;font-size:10px;min-width:62px;width:auto;padding:6px 8px;text-align:center;justify-content:center}
    #nav button[aria-selected="true"]::before{left:18%;right:18%;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
    #nav .badge{position:absolute;top:2px;right:10px;margin:0}
    .main{padding:14px 14px 96px}
    .mlogo{display:grid}
    .g3t .stat{padding:10px}.g3t .stat .v{font-size:16px}.g3t .stat .k{font-size:10px}
    #toast{bottom:84px}
  }
  .badge{background:var(--short);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:6px}.badge.mid{background:var(--pending);color:#0a0c10}

  /* layout */
  .g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;align-items:start}
  .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .stack{display:grid;gap:12px;min-width:0}
  @media (max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}}
  .stat{background:var(--inset);border-radius:12px;padding:12px 14px}.stat .k{font-size:11px;color:var(--mist)}.stat .v{font-size:20px;margin-top:3px;font-weight:500}.stat .s{font-size:11px;color:var(--mist);margin-top:2px}
  .big{font-size:32px;font-weight:500;letter-spacing:-.5px;margin:4px 0 2px}
  .spark{width:100%;height:auto;display:block}
  .spark .ln{fill:none;stroke:var(--long);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .spark .area{fill:rgba(34,197,94,.14)}.spark .dot{fill:var(--long);stroke:var(--panel);stroke-width:2}
  .spark.dn .ln{stroke:var(--short)}.spark.dn .area{fill:rgba(239,68,68,.12)}.spark.dn .dot{fill:var(--short)}
  .spark .g{stroke:var(--line);stroke-dasharray:3 4;stroke-width:1;vector-effect:non-scaling-stroke}
  .att{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.att:first-child{border-top:0}
  .att .t{flex:1;min-width:180px}
  .bar{height:6px;border-radius:4px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--long)}.bar.w i{background:var(--pending)}
  .bot{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.bot:first-child{border-top:0}
  .bot .n{font-weight:700}.bot .m{font-size:11px;color:var(--mist);grid-column:2/4}
  .sig{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.sig:first-child{border-top:0}
  .sig .tm{color:var(--mist);font-size:11px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{font-size:10px;color:var(--mist);text-align:left;font-weight:400;padding:6px 8px;text-transform:uppercase;letter-spacing:.4px}
  td{padding:11px 8px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr{cursor:pointer}tbody tr:hover td{background:rgba(238,241,246,.03)}
  td.r,th.r{text-align:right}
  .av{width:28px;height:28px;border-radius:50%;background:var(--inset);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:11px;color:var(--mist);margin-right:10px;vertical-align:middle;text-transform:uppercase}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filters input{width:auto;min-width:160px;flex:1;max-width:260px;padding:8px 12px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
  .sec{font-size:12px;font-weight:700;margin:20px 0 2px;padding-top:14px;border-top:1px solid var(--line)}.sec:first-child{margin-top:0;border-top:0;padding-top:0}
  .diff{margin:8px 0 0;padding:0;list-style:none}.diff li{padding:7px 0;border-top:1px solid var(--line);font-size:12px}.diff li:first-child{border-top:0}
  .sticky{position:sticky;top:12px}
  .ver{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.ver:first-child{border-top:0}.ver .t{flex:1;min-width:180px}
  .tag{font-size:10px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--mist);white-space:nowrap}
  .tag.ok{color:var(--long);border-color:#1d5a37}.tag.bad{color:var(--short);border-color:#6b2a2a}.tag.dry{color:var(--pending);border-color:#6b5320}

  /* hold to confirm */
  .hold{position:relative;overflow:hidden;width:100%;border-radius:10px;border:1px solid #5a2a30;background:rgba(239,68,68,.08);color:var(--short);padding:12px 14px;font-size:12px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;margin-top:8px}
  .hold .hf{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(45deg,rgba(242,177,52,.55) 0 10px,rgba(242,177,52,.25) 10px 20px)}
  .hold span{position:relative}.hold[disabled]{opacity:.45;cursor:not-allowed}
  .hold.sm{margin-top:0;padding:9px 10px;font-size:11.5px;text-align:center;line-height:1.25}
  .hold.win{border-color:#1d5a37;background:rgba(34,197,94,.07);color:var(--long)}
  .hold.neu{border-color:var(--line);background:var(--inset);color:var(--paper)}
  .cdeck{display:grid;gap:10px}.cdeck h4{margin:6px 0 0;font-size:10.5px;font-weight:500;color:var(--mist);letter-spacing:.05em;text-transform:uppercase}
  .cdeck .crow{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:8px}
  .cdeck .cpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,210px);gap:8px;align-items:center}
  .cdeck .chd{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:transparent;border:0;color:inherit;padding:0;cursor:pointer;text-align:left;font:inherit}
  .cwl2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cw{background:var(--inset);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
  .cw.win{border-color:#1d5a37;background:linear-gradient(180deg,rgba(34,197,94,.07),transparent 70%),var(--inset)}.cw.los{border-color:#5a2a30;background:linear-gradient(180deg,rgba(239,68,68,.07),transparent 70%),var(--inset)}
  .cwh{display:flex;align-items:center;justify-content:space-between;gap:8px}.cwt{font-size:13px;font-weight:600}
  .cwn{font-size:24px;font-weight:500;line-height:1.1}.cwl{display:grid;gap:3px;min-height:20px}
  .cwr{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-top:1px solid var(--line)}.cwr:first-child{border-top:0}
  .cw .hold{margin-top:4px}
  @media (max-width:640px){.cwl2{grid-template-columns:1fr}}
  .lt-x{display:flex;justify-content:flex-end}.lt-x .hold{width:auto;min-width:0;padding:7px 12px}

  /* drawer */
  .over{position:fixed;inset:0;z-index:50;background:rgba(5,6,9,.66);display:flex;justify-content:flex-end}
  .panel{background:var(--panel);overflow:auto;width:min(440px,100%);height:100%;padding:20px 16px 28px}
  .close{float:right;margin:-4px -4px 0 0}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:12px;z-index:80;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
</style>
</head>
<body>

<div id="login" class="card" hidden>
  <h1>YM Oracle console</h1>
  <p class="mist" style="margin-top:6px">Your session lasts 12 hours.</p>
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" aria-label="Admin password">
  <input id="totp" type="text" hidden placeholder="6-digit authenticator code" inputmode="numeric" autocomplete="one-time-code" aria-label="Authenticator code">
  <button class="btn pri" style="width:100%;margin-top:12px;padding:11px" id="loginBtn">Sign in</button>
  <div id="err" role="alert"></div>
</div>

<div id="app" hidden>
 <div class="shell">
  <nav id="nav" role="tablist" aria-label="Sections"><div class="navhead"><span class="logo">YM</span><div><b>YM Oracle</b><div class="mist small">Admin console</div></div></div>
    <div class="navlbl">Run</div>
    <button role="tab" data-tab="overview" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Overview</span><span class="badge" id="attBadge" hidden></span></button>

<script>
(function(){
'use strict';
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n,d){n=Number(n)||0;var a=Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d});return (n>=0?'+$':'-$')+a}
function cls(n){return n>=0?'long':'short'}
function ago(t){if(!t)return 'never';var s=Math.max(0,Math.round((Date.now()-new Date(t).getTime())/1000));return s<60?s+'s ago':(s<3600?Math.round(s/60)+'m ago':(s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'))}
function clock(t){var d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function up(m){if(m==null)return null;if(m<60)return m+'m';if(m<1440)return Math.floor(m/60)+'h '+(m%60)+'m';return Math.floor(m/1440)+'d '+Math.floor((m%1440)/60)+'h'}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2800)}
function copy(txt,msg){try{navigator.clipboard.writeText(txt).then(function(){toast(msg||'Copied')},function(){toast('Select the text to copy')})}catch(e){toast('Select the text to copy')}}

/* ---------- api ---------- */
function tok(){try{return sessionStorage.getItem('ym_admin_token')||''}catch(e){return ''}}
function setTok(v){try{if(v)sessionStorage.setItem('ym_admin_token',v);else sessionStorage.removeItem('ym_admin_token')}catch(e){}}
function api(path,method,body){
  return fetch(path,{method:method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok()},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===401){setTok('');showLogin();throw new Error('signed out')}
    return r;
  });
}
function j(path,method,body){return api(path,method,body).then(function(r){return r.json()})}
function jq(path){return j(path).catch(function(){return null})}   // a card that cannot load simply stays hidden

/* ---------- state ---------- */
var TABS=['overview','live','trading','guards','bots','users','plan','activity','payments','settings'];
var TITLES={overview:'Overview',live:'Live trades',trading:'Trading',guards:'Guards',bots:'Bots & alerts',users:'Users',plan:'Plan & risk',activity:'Activity',payments:'Payments',settings:'Settings'};
var S={pg:null,pgPending:null,ar:null,arHours:4,tab:'overview',tr:null,ping:null,mk:{info:null,open:false,env:'live',key:'',sec:'',msg:null,busy:false,confirm:false,arm:false},liveAsk:false,liveTxt:'',users:[],pausedAll:false,dryAll:false,planVersion:null,plan:null,ov:null,period:30,series:null,bots:null,signals:null,sec:null,
  filter:'all',q:'',ofilter:'all',ouser:'',orders:null,audit:null,openId:null,planDraft:null,planPreview:null,planCounts:null,hist:null,drySummary:null,hash:'',timer:null,drawerMsg:''};
var HOLD={};

/* ---------- login ---------- */
function showLogin(){$('#app').hidden=true;$('#login').hidden=false;if(S.timer){clearInterval(S.timer);S.timer=null}}
function doLogin(){
  var err=$('#err');err.textContent='';
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value,totp:$('#totp').value})}).then(function(r){return r.json()}).then(function(d){
    if(d.needTotp){$('#totp').hidden=false;$('#totp').focus();err.textContent=d.message||'';return}
    if(!d.success){err.textContent=d.message||'Sign in failed';return}
    setTok(d.token);$('#pw').value='';$('#totp').value='';start();
  }).catch(function(){err.textContent='Could not reach the server.'});
}
function start(){
  $('#login').hidden=true;$('#app').hidden=false;
  var h=(location.hash||'').replace('#','');if(TABS.indexOf(h)>-1)S.tab=h;
  refreshAll();
  if(S.timer)clearInterval(S.timer);
  S.tick=0;S.timer=setInterval(function(){if(document.hidden||S.planEditing||S.holding)return;S.tick++;if(S.tab==='trading'||S.tab==='live'||S.tick%2===0)refreshAll(true)},10000);
}

/* ---------- loading ---------- */
function refreshAll(quiet){
  return jq('/api/admin/users').then(function(u){
    if(!u)return;
    if(!u.success){$('#body').innerHTML='<div class="card"><b>Multi-user mode is off</b><p class="mist" style="margin-top:6px">'+esc(u.message||'Set DATABASE_URL and KEY_ENCRYPTION_SECRET on Render to turn it on.')+'</p></div>';return}
    S.users=u.users;S.pausedAll=!!u.pausedAll;S.dryAll=!!u.dryAll;S.planVersion=u.planVersion;S.plan=u.plan;S.totalNet=u.totalNet;
    return loadTab();
  });
}
function loadTab(){
  var t=S.tab,jobs=[];
  if(t==='overview'){
    jobs.push(jq('/api/admin/overview').then(function(r){S.ov=r&&r.success?r:null}));
    jobs.push(jq('/api/admin/series?days='+S.period).then(function(r){S.series=r&&r.success?r.points:null}));
    jobs.push(jq('/api/admin/bots').then(function(r){S.bots=r&&r.success?r.bots:null}));
    jobs.push(jq('/api/admin/signals?limit=6').then(function(r){S.signals=r&&r.success?r.signals:null}));
    jobs.push(jq('/api/admin/master').then(function(r){S.master=r&&r.success?r:null}));
    jobs.push(jq('/api/admin/security').then(function(r){S.sec=r&&r.success?r.checks:null}));
  }else{
    jobs.push(jq('/api/admin/overview').then(function(r){S.ov=r&&r.success?r:S.ov}));
  }
  if(t==='trading')jobs.push(loadTrading());
  if(t==='bots'){
    jobs.push(jq('/api/admin/bots').then(function(r){S.bots=r&&r.success?r.bots:null}));
    jobs.push(jq('/api/admin/alerts').then(function(r){S.alerts=r&&r.success?r:S.alerts}));
    jobs.push(jq('/api/admin/alert-routes').then(function(r){S.ar=r&&r.success?r:S.ar}));
    jobs.push(jq('/api/admin/signal-ledger?hours=24&limit=1').then(function(r){S.ledger=r&&r.success?r:S.ledger}));
  }
  if(t==='settings'){
    jobs.push(jq('/api/master-key').then(function(r){if(r&&r.success){S.mk.info=r;if(!S.mk.open&&(r.env==='demo'||r.env==='live'))S.mk.env=r.env}}));
    jobs.push(jq('/api/admin/security').then(function(r){S.sec=r&&r.success?r.checks:null}));
  }
  if(t==='plan'){
    jobs.push(jq('/api/admin/plan').then(function(r){if(r&&r.success){S.planCounts=r;if(!S.planDraft)S.planDraft=draftFrom(r.plan)}}));
    jobs.push(jq('/api/admin/plan/history?limit=12').then(function(r){S.hist=r&&r.success?r:null}));
    jobs.push(jq('/api/admin/orders/summary?hours=24').then(function(r){S.drySummary=r&&r.success?r.users:null}));
  }
  if(t==='guards'){
    jobs.push(jq('/api/admin/profit-guard').then(function(r){S.pg=r&&r.success?r:S.pg}));
    jobs.push(jq('/api/admin/sentinel').then(function(r){S.sn=r&&r.success?r:S.sn}));
  }
  if(t==='live'||t==='overview')jobs.push(jq('/api/admin/live-trades').then(function(r){S.live=r&&r.success?r:S.live}));
  if(t==='activity'){
    jobs.push(loadOrders());
    jobs.push(jq('/api/admin/signal-ledger?hours=48&limit=25').then(function(r){S.ledger=r&&r.success?r:null}));
    jobs.push(jq('/api/admin/audit?limit=30').then(function(r){S.audit=r&&r.success?r.rows:null}));
  }
  return Promise.all(jobs).then(render);
}
function loadTrading(){
  return Promise.all([jq('/api/status'),jq('/api/balance'),jq('/api/positions'),jq('/api/trade-log'),jq('/api/sync-status'),jq('/api/exec-reports')]).then(function(r){
    var st=r[0],bal=r[1],pos=r[2],log=r[3],sy=r[4],ex=r[5];
    S.tr={ok:!!st,mode:st?st.mode:'paper',halted:!!(st&&st.breaker&&st.breaker.tripped),balance:bal&&bal.success?bal.balance:null,available:bal&&bal.success?bal.available:null,
      positions:pos&&pos.success?pos.positions:[],closed:(log&&log.success?log.trades:[]).filter(function(x){return x.status==='CLOSED'}),sync:sy&&sy.success?sy:null,exec:ex&&ex.success?ex.reports||[]:[],at:Date.now()};
  });
}
function loadOrders(){
  var k=S.ofilter,u=S.ouser.trim();
  return jq('/api/admin/orders?limit=40'+(u?'&user='+encodeURIComponent(u):'')+(k==='failed'?'&failed=1':'')+(k==='dry'?'&dry=1':'')).then(function(r){S.orders=r&&r.success?r.rows:null});
}

/* ---------- hold to confirm ---------- */
function bindHold(btn){
  var key=btn.getAttribute('data-hold'),f=btn.querySelector('.hf'),D=1100,t0=0,raf=0,on=false;
  function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/D);f.style.width=(p*100)+'%';if(p>=1){stop();if(HOLD[key])HOLD[key](btn)}else raf=requestAnimationFrame(step)}
  function start_(){if(btn.disabled||on)return;on=true;S.holding=true;t0=0;raf=requestAnimationFrame(step)}
  function stop(){on=false;S.holding=false;cancelAnimationFrame(raf);t0=0;f.style.width='0'}
  btn.addEventListener('pointerdown',function(e){e.preventDefault();start_()});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){btn.addEventListener(ev,stop)});
  btn.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();start_()}});
  btn.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')stop()});
}
function bindHolds(root){$$('[data-hold]',root).forEach(function(b){if(!b.__h){b.__h=1;bindHold(b)}})}
function holdBtn(key,label,data){return '<button class="hold" data-hold="'+key+'"'+(data||'')+'><span class="hf"></span><span>'+label+'</span></button>'}

/* ---------- small renderers ---------- */
function spark(d,w,h){
  if(!d||d.length<2)return '';
  var mn=Math.min.apply(null,d.concat([0])),mx=Math.max.apply(null,d.concat([0])),r=(mx-mn)||1,p=6;
  function x(i){return p+i*(w-p*2)/(d.length-1)} function y(v){return h-p-(v-mn)/r*(h-p*2)}
  var pts=d.map(function(v,i){return x(i).toFixed(1)+','+y(v).toFixed(1)}).join(' ');
  return '<svg class="spark '+(d[d.length-1]>=0?'':'dn')+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Net result over time"><line class="g" x1="0" x2="'+w+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'"/><polygon class="area" points="'+p+','+h+' '+pts+' '+(w-p)+','+h+'"/><polyline class="ln" points="'+pts+'"/><circle class="dot" cx="'+x(d.length-1).toFixed(1)+'" cy="'+y(d[d.length-1]).toFixed(1)+'" r="4"/></svg>';
}
var STLAB=function(u){
  if(u.keyStatus==='error')return ['Key error','short'];
  if(u.keyStatus==='removed')return ['Key removed',''];
  if(!u.active)return ['Disabled',''];
  if(u.paused)return ['Paused','warn'];
  return ['Active','long'];
};
function coinOf(s){return String(s||'').replace('USDT','')}

/* ---------- header + banners ---------- */
function renderHeader(){
  var p=$('#statePill');p.className='pill '+(S.pausedAll?'paused':S.dryAll?'dry':'live');
  $('#stateTxt').textContent=S.pausedAll?'PAUSED':S.dryAll?'DRY RUN':'LIVE';
  $('#swDry').checked=S.dryAll;$('#swPause').checked=S.pausedAll;
  $('#planVer').textContent='v'+(S.planVersion||'-');
  var h='';
  if(S.pausedAll)h+='<div class="box red" style="margin-top:12px"><b>New trades are paused for all users.</b> Open trades are still managed and closed as normal.</div>';
  if(S.dryAll)h+='<div class="box" style="margin-top:12px"><b>Dry run is on.</b> Every signal is worked out for each account but nothing is sent to Bybit. Closes still go through.</div>';
  $('#notice').innerHTML=h;
  var n=S.ov?S.ov.attention.length:0,high=S.ov?S.ov.attention.filter(function(a){return a.severity==='high'}).length:0,b=$('#attBadge');
  b.hidden=!n;b.textContent=n;b.className='badge'+(high?'':' mid');
  $$('#nav button[data-tab]').forEach(function(x){x.setAttribute('aria-selected',x.getAttribute('data-tab')===S.tab)});
  $('#pageTitle').textContent=TITLES[S.tab]||'';try{document.title='YM Oracle – '+(TITLES[S.tab]||'Console')}catch(e){}
}

/* ---------- overview ---------- */
function viewOverview(){
  var o=S.ov,t=o?o.tiles:null,h='';
  var pts=S.series?S.series.map(function(x){return x.net}):null,last=pts?pts[pts.length-1]:(t?t.pnlTotal:0);
  h+='<div class="g2"><div class="stack">';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div><div class="mist small">Net result, all users</div><div class="big num '+cls(last)+'">'+money(last)+'</div><div class="mist small">Closed PnL plus funding fees, last '+S.period+' days.'+(t?' All time '+money(t.pnlTotal)+'.':'')+'</div></div>'
    +'<div class="seg" role="group" aria-label="Period">'+[7,30,90].map(function(k){return '<button data-period="'+k+'" aria-pressed="'+(S.period===k)+'">'+k+'d</button>'}).join('')+'</div></div>'
    +'<div style="margin-top:8px">'+spark(pts,640,96)+'</div>';
  if(t){
    h+='<div class="g3" style="margin-top:12px">'
     +'<div class="stat"><div class="k">Accounts trading</div><div class="v num">'+t.trading+'</div><div class="s">'+t.users+' signed up</div></div>'
     +'<div class="stat"><div class="k">Today</div><div class="v num '+cls(t.pnlToday)+'">'+money(t.pnlToday,0)+'</div><div class="s">7 days '+money(t.pnl7d,0)+'</div></div>'
     +'<div class="stat"><div class="k">Orders, 24h</div><div class="v num">'+t.ordersPlaced24h+'</div><div class="s">'+t.ordersSkipped24h+' skipped by rules</div></div>'
     +'<div class="stat"><div class="k">Failed, 24h</div><div class="v num '+(t.ordersFailed24h?'warn':'')+'">'+t.ordersFailed24h+'</div><div class="s">'+(t.keyErrors?t.keyErrors+' key error(s)':'no key errors')+'</div></div>'
     +'<div class="stat"><div class="k">Total balance</div><div class="v num">$'+Number(t.equity).toLocaleString(undefined,{maximumFractionDigits:0})+'</div><div class="s">trading accounts</div></div></div>';
  }
  h+='</div>';
  if(S.master){
    var m=S.master,sy=m.sync||{},syncTxt,syncCls;
    if(sy.mode==='paper'){syncTxt='Paper mode: nothing is sent to Bybit';syncCls=''}
    else if(sy.lastError){syncTxt='Could not check Bybit: '+esc(sy.lastError);syncCls='warn'}
    else if(!sy.lastOkAt){syncTxt='Waiting for the first check against Bybit';syncCls=''}
    else if(sy.masterOpen!=null&&sy.loggedOpen!=null&&sy.masterOpen!==sy.loggedOpen&&sy.staleOpen){syncTxt='Bybit shows '+sy.masterOpen+' open, the log shows '+sy.loggedOpen+'. Checked '+ago(sy.lastOkAt);syncCls='warn'}
    else{syncTxt='In step with Bybit: '+sy.masterOpen+' open trade(s), all logged. Checked '+ago(sy.lastOkAt);syncCls='long'}
    var tr=(m.reports||[]).filter(function(r){return r.kind==='TRADE'}).slice(0,5);
    h+='<div class="card"><h2 style="margin:0 0 4px">Master account<span class="new">New</span></h2>'
      +'<div class="line"><span class="'+syncCls+'">'+syncTxt+'</span></div>'
      +'<div class="line"><span class="mist">Last 24h: '+m.counts.ok+' placed, '+m.counts.warn+' with a warning, '+m.counts.fail+' refused</span></div>'
      +(tr.length?tr.map(function(r){var t=r.sev==='fail'?['bad',r.text]:r.sev==='warn'?['dry',r.text]:['ok',r.text];
        return '<div class="sig"><span class="tm num">'+clock(r.at)+'</span><span style="min-width:0"><b>'+esc(coinOf(r.symbol))+'</b> <span class="'+(r.side==='BUY'?'long':'short')+'">'+(r.side==='BUY'?'LONG':'SHORT')+'</span><br><span class="mist small">'+esc(String(r.bot||'').replace('YM ORACLE ','Oracle '))+(r.detail&&r.sev!=='quiet'?' · '+esc(r.detail):'')+'</span></span><span class="tag '+t[0]+'">'+esc(t[1])+'</span></div>'}).join('')
        :'<p class="mist" style="padding:10px 0">No trades reported by the manager in the last 24 hours.</p>')+'</div>';
  }
  if(S.signals){
    h+='<div class="card"><h2 style="margin:0 0 4px">Live signals<span class="new">New</span></h2>'+(S.signals.length?S.signals.map(function(g){
      var bits=[];if(g.placed)bits.push('Copied to '+g.placed);if(g.dry)bits.push(g.dry+' dry run');if(g.skipped)bits.push(g.skipped+' skipped by rules');if(g.failed)bits.push(g.failed+' failed');
      var tag=g.failed?['bad','Failures']:g.placed?['ok','Copied']:g.dry?['dry','Dry']:['','Filtered'];
      return '<div class="sig"><span class="tm num">'+clock(g.at)+'</span><span style="min-width:0"><b>'+esc(coinOf(g.symbol))+'</b> <span class="'+(g.side==='LONG'?'long':'short')+'">'+g.side+'</span><br><span class="mist small">'+esc(bits.join(' · ')||'No orders')+' of '+g.total+' accounts</span></span><span class="tag '+tag[0]+'">'+tag[1]+'</span></div>';
    }).join(''):'<p class="mist" style="padding:10px 0">No signals in the last 24 hours.</p>')+'</div>';
  }

function mkSave(){
  var M=S.mk;if(M.busy)return;
  if(!M.key.trim()||!M.sec.trim()){M.msg={ok:false,text:'Paste both the key and the secret.'};render();return}
  M.busy=true;M.msg=null;render();
  j('/api/master-key','POST',{apiKey:M.key.trim(),apiSecret:M.sec.trim(),env:M.env,confirmOpen:!!M.confirm}).then(function(r){
    M.busy=false;
    if(r.success){M.key='';M.sec='';M.confirm=false;M.open=false;M.msg={ok:true,text:'Saved. Now trading with '+r.hint+' ('+(r.env==='demo'?'Demo':'Live')+')'+(r.equity!=null?', balance '+usd(r.equity):'')+'.'+(r.warning?' '+r.warning:'')};loadTab()}
    else if(r.needConfirm){M.confirm=r.message;render()}
    else{M.confirm=false;M.msg={ok:false,text:r.message||'Could not save the key.'};render()}
  }).catch(function(){M.busy=false;M.msg={ok:false,text:'Could not reach the server.'};render()});
}
function mkReset(){
  var M=S.mk;
  if(!M.arm){M.arm=true;render();setTimeout(function(){M.arm=false;render()},3000);return}
  M.arm=false;
  j('/api/master-key/reset','POST').then(function(r){M.msg=r.success?{ok:true,text:'Back on the Render settings ('+r.hint+').'}:{ok:false,text:r.message||'Could not reset.'};loadTab()});
}


/* ---------- live trades ---------- */
function fmtP(v){v=Number(v);if(!(v>0))return '–';return String(parseFloat(v.toPrecision(6)))}
function ringHtml(q){var s=q&&q.score!=null?q.score:null,b=q?q.band:'unknown',c=2*Math.PI*21,k=b==='at risk'?'risk':b;
  return '<div class="ring" title="Quality '+(s==null?'unknown':s+' of 100 · '+esc(b))+'"><svg viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="21"/><circle class="fg fg-'+k+'" cx="27" cy="27" r="21" stroke-dasharray="'+((s==null?0:s)/100*c).toFixed(1)+' '+c.toFixed(1)+'"/></svg><b class="bnd-'+k+'">'+(s==null?'–':s)+'</b></div>'}
function ladderHtml(t){
  var q=t.quality||{},L=t.side==='Buy',vals=[t.entry,t.mark,t.peak,t.stopLoss,t.takeProfit,t.initialSl].filter(function(v){return v>0}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),span=(hi-lo)||1;
  lo-=span*0.06;hi+=span*0.06;span=hi-lo;var X=function(v){return Math.max(0,Math.min(100,(v-lo)/span*100)).toFixed(2)+'%'},xn=function(v){return Math.max(0,Math.min(100,(v-lo)/span*100))};
  var z='',sl=t.initialSl>0?t.initialSl:0,e=xn(t.entry);
  if(sl>0){var a=Math.min(xn(sl),e),w=Math.abs(e-xn(sl));z+='<span class="zr" style="left:'+a.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></span>'}
  if(t.takeProfit>0){var a2=Math.min(e,xn(t.takeProfit)),w2=Math.abs(xn(t.takeProfit)-e);z+='<span class="zg" style="left:'+a2.toFixed(2)+'%;width:'+w2.toFixed(2)+'%"></span>'}
  if(q.stopR!=null&&q.stopR>0.02&&t.stopLoss>0){var a3=Math.min(e,xn(t.stopLoss)),w3=Math.abs(xn(t.stopLoss)-e);z+='<span class="zl" style="left:'+a3.toFixed(2)+'%;width:'+w3.toFixed(2)+'%"></span>'}
  var up=(L?t.mark>=t.entry:t.mark<=t.entry);
  var m='';
  if(sl>0)m+='<span class="mk sl" style="left:'+X(sl)+'" title="Original stop '+fmtP(sl)+'"></span>';
  if(t.stopLoss>0&&Math.abs(t.stopLoss-sl)>1e-12)m+='<span class="mk st" style="left:'+X(t.stopLoss)+'" title="Stop now '+fmtP(t.stopLoss)+'"></span>';
  m+='<span class="mk en" style="left:'+X(t.entry)+'" title="Entry '+fmtP(t.entry)+'"></span>';
  if(t.peak>0&&t.peak!==t.entry)m+='<span class="mk pk" style="left:'+X(t.peak)+'" title="Best price '+fmtP(t.peak)+'"></span>';
  if(t.takeProfit>0)m+='<span class="mk tp" style="left:'+X(t.takeProfit)+'" title="Target '+fmtP(t.takeProfit)+'"></span>';
  m+='<span class="nw '+(up?'up':'dn')+'" style="left:'+X(t.mark)+'" title="Price now '+fmtP(t.mark)+'"></span>';
  return '<div class="lad" role="img" aria-label="Where price is between the stop, entry and target"><div class="trk">'+z+'</div>'+m+'</div>';
}
function trailHtml(tr){
  if(!tr||tr.length<3)return '';var mn=Math.min.apply(null,tr.concat([0])),mx=Math.max.apply(null,tr.concat([0])),r=(mx-mn)||1,w=300,h=34,pd=3;
  var pts=tr.map(function(v,i){return (pd+i*(w-pd*2)/(tr.length-1)).toFixed(1)+','+(h-pd-(v-mn)/r*(h-pd*2)).toFixed(1)}).join(' ');
  var y0=(h-pd-(0-mn)/r*(h-pd*2)).toFixed(1);
  return '<svg class="lt-tr" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Result in R over the last hour"><line class="g" x1="0" x2="'+w+'" y1="'+y0+'" y2="'+y0+'"/><polyline class="ln" points="'+pts+'"/></svg>';

function closeDeck(V){
  var T=V.trades||[],n=T.length,sum=function(a){return a.reduce(function(s,t){return s+(t.upl||0)},0)};
  var win=T.filter(function(t){return t.upl>0}).sort(function(a,c){return c.upl-a.upl}),los=T.filter(function(t){return t.upl<0}).sort(function(a,c){return a.upl-c.upl});

  var hb=function(scope,label,arr,cls,data){return '<button class="hold sm '+cls+'" data-hold="closeScope" data-scope="'+scope+'"'+(data||'')+(arr.length?'':' disabled')+'><span class="hf"></span><span>'+label+'</span></button>'};
  var panel=function(scope,title,arr,kind,empty){
    var rows=arr.slice(0,6).map(function(t){return '<div class="cwr"><span><b>'+esc(coinOf(t.symbol))+'</b> <span class="'+(t.side==='Buy'?'long':'short')+'">'+(t.side==='Buy'?'LONG':'SHORT')+'</span></span><span class="num '+cls(t.upl)+'">'+pnlTxt(t.upl)+'</span></div>'}).join('');

    return '<div class="cw '+kind+'"><div class="cwh"><span class="cwt">'+title+'</span><span class="chip">'+arr.length+' trade'+(arr.length===1?'':'s')+'</span></div>'

  if(!V)return h+'<div class="card"><p class="mist" style="padding:6px 0">Loading…</p></div>';
  if(V.master===false)h+='<div class="box red" style="margin-bottom:12px">Guards are switched OFF: these trades run only on their own stops. <button class="btn pri" style="margin-left:8px" data-act="gmaster" data-v="on">Turn guards on</button></div>';
  if(!V.trades||!V.trades.length)return h+'<div class="card"><p class="mist" style="padding:14px 0;text-align:center">'+esc(V.note||'No open trades right now.')+'</p></div>';
  var sm=V.summary||{},b=sm.bands||{},tot=sm.open||1,attn=(b.fragile||0)+(b['at risk']||0);

  h+='<div class="sumrow"><div class="stat"><div class="k">Open trades</div><div class="v num">'+sm.open+'</div><div class="s">'+usd(sm.margin,0)+' margin in use</div></div>'

    +'<div class="stat"><div class="k">Average quality</div><div class="v num">'+(sm.avgScore==null?'–':sm.avgScore)+'<span class="mist small"> / 100</span></div></div>'
    +'<div class="stat"><div class="k">Need attention</div><div class="v num '+(attn?'warn':'')+'">'+attn+'</div><div class="s">fragile or at risk</div></div></div>';
  h+='<div class="bandbar" style="margin:12px 0 4px" role="img" aria-label="Trades by quality band">'+['strong','steady','fragile','at risk','unknown'].map(function(k){return b[k]?'<i style="flex:'+b[k]+';background:'+col[k]+'" title="'+b[k]+' '+k+'"></i>':''}).join('')+'</div>';
  h+='<div class="hint2" style="margin-bottom:12px">'+['strong','steady','fragile','at risk'].map(function(k){return '<span class="bnd-'+(k==='at risk'?'risk':k)+'">●</span> '+(b[k]||0)+' '+k}).join(' &nbsp; ')+'</div>';
  h+=closeDeck(V);
  var tr=V.trades.slice();
  if(S.liveSort==='best')tr.sort(function(a,c){return ((c.quality&&c.quality.score)||0)-((a.quality&&a.quality.score)||0)});
  else if(S.liveSort==='new')tr.sort(function(a,c){return c.openedAt-a.openedAt});
  else if(S.liveSort==='pnl')tr.sort(function(a,c){return c.upl-a.upl});
  h+='<div class="sec2"><h3>Trades</h3><div class="seg" role="group" aria-label="Sort">'+[['worst','Needs attention first'],['best','Best first'],['new','Newest'],['pnl','Result']].map(function(m){return '<button data-ls="'+m[0]+'" aria-pressed="'+((S.liveSort||'worst')===m[0])+'">'+m[1]+'</button>'}).join('')+'</div></div>';

  return h;
}
